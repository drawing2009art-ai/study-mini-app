
name: Build Android Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-habit-tracker:
    name: Build Habit Tracker APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: timer-android-github

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build Habit Tracker APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Habit Tracker APK
        uses: actions/upload-artifact@v4
        with:
          name: Habit-Tracker-APK
          path: timer-android-github/android/app/build/outputs/apk/debug/app-debug.apk

  build-piptrack:
    name: Build PipTrack APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: PipTrack-GitHub-Ready

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build PipTrack APK
        run: gradle --no-daemon assembleDebug

      - name: Upload PipTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: PipTrack-APK
          path: PipTrack-GitHub-Ready/app/build/outputs/apk/debug/app-debug.apk
