<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09070B"><style>:root{color-scheme:dark}html,body{margin:0;background:#09070B}</style></head><body>
<title>Timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@200..700&display=swap">
<style>
/* Layout: one phone-width column. Timer list, Calendar, Reports behind a bottom bar; the stopwatch is a separate full-screen layer. */
:root{
  --bg:#09070B; --card:#17121D; --card-hi:#211A2A; --sheet:#1C1624; --line:#2B2235;
  --accent:#C85BCB; --accent-ink:#1B0B1D; --fg:#F5F1F7; --mute:#AAA0B2; --dim:#7A6F84;
  --danger:#F2778A; --ok:#6FD39B; --warn:#F2B84B;
  --font:'Roboto Flex',Roboto,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.4 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.f{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding-bottom:230px}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:14px}
.top h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.top .date{color:var(--mute);font-size:14px;margin-top:2px}
.top-actions{display:flex;gap:4px}
.icon-btn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--fg)}
.icon-btn:hover{background:var(--card)}
.tabs-line{height:1px;background:var(--line);margin:14px 0 0}
.today-row{display:flex;justify-content:space-between;align-items:baseline;padding:18px 4px 12px}
.today-row span{font-size:17px;font-weight:600;letter-spacing:.02em;color:var(--fg)}
.today-row b{font-size:17px;font-weight:600;color:#D8B4DA}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 12px}
.chip{min-height:36px;padding:0 14px;border-radius:18px;background:var(--card);color:var(--mute);font-size:13.5px;font-weight:500;border:1px solid transparent}
.chip.on{background:#3B2D42;color:var(--fg)}
.tools .grow{flex:1}

/* task cards */
.card{background:var(--card);border-radius:20px;padding:14px 14px 10px 16px;margin:0 0 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px}
.card h3{margin:0;font-size:19px;font-weight:500;display:flex;align-items:center;gap:10px;min-width:0}
.card h3 span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.card .desc{color:var(--mute);font-size:13.5px;margin:4px 0 0 22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .time{font-size:18px;font-weight:500;text-align:right;color:#D8B4DA;align-self:start;padding-top:2px}
.card .row2{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;margin-left:22px;color:var(--mute)}
.status.running{color:var(--ok)}
.status.paused{color:var(--warn)}
.pulse{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.running .pulse,.pulse.run{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.card-acts{display:flex;align-items:center;gap:2px;margin-left:auto}
.card-acts .icon-btn{width:40px;height:40px;color:var(--mute)}
.card-acts .icon-btn svg{width:20px;height:20px}
.play{width:46px;height:46px;border-radius:23px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-left:6px}
.play svg{width:22px;height:22px}
.empty{background:var(--card);border-radius:24px;padding:28px 22px;text-align:left;margin-top:8px}
.empty h2{margin:0 0 6px;font-size:22px;font-weight:600}
.empty p{margin:0 0 18px;color:var(--mute);max-width:42ch}

/* buttons */
.btn{min-height:46px;padding:0 20px;border-radius:23px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:#2A2133;color:var(--fg)}
.btn.danger{background:#3A1F28;color:var(--danger)}
.btn.quiet{color:var(--mute)}
.btn.full{width:100%}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to bottom,rgba(9,7,11,0),var(--bg) 22%)}
.dock-in{max-width:560px;margin:0 auto}
.quick{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.quick input{flex:1;min-width:0;height:56px;border-radius:16px;background:var(--card);border:1px solid var(--line);padding:0 18px;font-size:18px;color:var(--fg)}
.quick input::placeholder{color:#8F7F99}
.fab{width:58px;height:58px;border-radius:29px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.fab svg{width:28px;height:28px}
.mini{width:100%;display:flex;align-items:center;gap:10px;background:#241B2D;border:1px solid var(--line);border-radius:18px;min-height:52px;padding:0 16px;margin-bottom:8px;text-align:left}
.mini .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.mini .tm{font-weight:600;color:#D8B4DA}
.mini .go{color:var(--accent);font-weight:600;font-size:14px}
.mini.running .pulse{color:var(--ok)}
.mini.paused .pulse{color:var(--warn)}
.nav{display:flex;padding:2px 0 8px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);min-height:60px;font-size:13px;font-weight:500;padding-top:6px}
.nav .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
.nav .on{color:var(--fg)}
.nav .on .pill{background:#4A3A52}

/* stopwatch */
.sw{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px))}
.sw-in{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.sw-top{display:flex;align-items:center;gap:8px;min-height:52px}
.sw-task{flex:1;display:flex;justify-content:center;align-items:center;gap:10px;font-size:18px;font-weight:500;min-width:0}
.sw-task span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw-spacer{width:44px}
.sw-center{padding:clamp(24px,9vh,90px) 0 10px;text-align:center}
.sw-time{display:flex;justify-content:center;align-items:baseline;gap:.16em;font-size:clamp(34px,11.4vw,76px);font-weight:250;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:0}
.sw-time span{display:inline-block;min-width:1.15em;text-align:center}
.sw-time i{font-style:normal;color:var(--dim);display:inline-block;width:.3em;text-align:center}
.sw-state{margin-top:10px;font-size:14px;color:var(--mute);min-height:20px;display:inline-flex;align-items:center;gap:8px}
.sw-state.running{color:var(--ok)}
.sw-state.paused{color:var(--warn)}
.laps{flex:1;min-height:0;overflow:auto;list-style:none;margin:10px 0 14px;padding:0}
.laps li{display:grid;grid-template-columns:1fr auto auto;gap:18px;padding:12px 6px;border-bottom:1px solid var(--line);font-size:17px;font-variant-numeric:tabular-nums}
.laps li.hd{position:sticky;top:0;background:var(--bg);color:var(--dim);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px}
.laps li .n{color:var(--mute)}
.laps li .c{color:var(--mute);min-width:6.5ch;text-align:right}
.laps li .sp{min-width:6.5ch;text-align:right;font-weight:500}
.laps .none{border:0;color:var(--dim);display:block;text-align:center;font-size:14px;padding-top:24px}
.sw-ctl{display:flex;gap:16px;justify-content:center}
.pillbtn{flex:1;max-width:220px;height:66px;border-radius:33px;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center}
.pillbtn.l{background:#241C2C;color:var(--mute)}
.pillbtn.l:disabled{opacity:.5}
.pillbtn.r{background:var(--accent);color:var(--accent-ink)}
.sw-save{margin:14px auto 0;min-height:48px;padding:0 22px;border-radius:24px;border:1px solid var(--line);color:var(--fg);font-weight:500;display:flex;gap:8px;align-items:center}
.sw-save[hidden]{display:none}
.sw-foot{min-height:62px}

/* calendar + reports shared */
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:14px}
.sec-title h1{margin:0;font-size:30px;font-weight:600;line-height:1.15}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:12px 0 8px}
.nav-row .lbl{font-size:18px;font-weight:600;text-align:center;flex:1}
.nav-row .icon-btn:disabled{opacity:.3}
.nav-row .icon-btn{background:var(--card)}
.sub{color:var(--mute);font-size:14px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;text-align:center;color:var(--dim);font-size:12px;font-weight:500;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{aspect-ratio:1/1.1;min-height:48px;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:500;border:2px solid transparent;position:relative}
.day small{font-size:11px;color:#D8B4DA;font-variant-numeric:tabular-nums;min-height:13px;font-weight:500}
.day.blank{background:none;pointer-events:none}
.day.today b{color:var(--accent)}
.day.sel{border-color:var(--accent)}
.panel{background:var(--card);border-radius:22px;padding:16px;margin-top:14px}
.panel h2{margin:0;font-size:19px;font-weight:600}
.total-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:2px}
.total-line b{font-size:22px;font-weight:600;color:#D8B4DA}
.list{list-style:none;margin:12px 0 0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.list li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li .v{font-variant-numeric:tabular-nums;font-weight:500}
.list li .pc{width:44px;text-align:right;color:var(--mute);font-size:13.5px;font-variant-numeric:tabular-nums}
.sess{padding:10px 0;border-top:1px solid var(--line)}
.sess-h{display:flex;align-items:center;gap:10px;min-width:0}
.sess-h .nm{flex:1;min-width:0}
.sess-h .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-h .nm small{color:var(--mute);font-size:13px}
.sess-h .v{font-weight:500;font-variant-numeric:tabular-nums}
.sess-h .icon-btn{width:40px;height:40px;color:var(--mute)}
.sess-h .icon-btn svg{width:20px;height:20px}
.sess .lapl{list-style:none;margin:8px 0 0 22px;padding:0;color:var(--mute);font-size:13.5px;font-variant-numeric:tabular-nums}
.sess .lapl li{display:flex;justify-content:space-between;padding:3px 0}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;background:#2A2133;color:var(--mute)}
.tag.running{color:var(--ok)}
.tag.paused{color:var(--warn)}
.seg{display:flex;background:var(--card);border-radius:20px;padding:4px;gap:4px;margin-top:12px}
.seg button{flex:1;min-height:40px;border-radius:16px;color:var(--mute);font-weight:500}
.seg button.on{background:#3B2D42;color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:18px;padding:14px}
.stat span{display:block;color:var(--mute);font-size:13px}
.stat b{display:block;font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.wide{grid-column:1 / -1}
.stat .d{font-size:13.5px;font-weight:500;color:var(--mute)}
.stat .d.up{color:var(--ok)}
.stat .d.dn{color:var(--warn)}
.chartbox{margin-top:12px}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox text{fill:var(--mute);font-family:var(--font);font-size:10px}
.chartbox text.val{fill:var(--fg);font-size:9.5px}
.legend{display:flex;gap:16px;color:var(--mute);font-size:12.5px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;justify-content:center;margin:6px 0 2px}
.donut-wrap svg{width:min(220px,62vw);height:auto}
.donut-wrap text{fill:var(--fg);font-family:var(--font);font-size:15px;font-weight:600;text-anchor:middle}
.donut-wrap text.s{fill:var(--mute);font-size:8.5px;font-weight:400}
.hbar{height:8px;border-radius:4px;background:#2A2133;overflow:hidden;margin-top:6px}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.wk{padding:10px 0;border-top:1px solid var(--line)}
.wk .r{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.wk .r span:first-child{color:var(--mute)}
.note{color:var(--mute);font-size:14px;padding:14px 0 2px}
.dl{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:14.5px}
.dl span:first-child{color:var(--mute)}
.dl .d{font-size:12.5px;color:var(--mute);min-width:6ch;text-align:right}
.dl .d.up{color:var(--ok)}
.dl .d.dn{color:var(--warn)}

/* modal + toast */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(5,3,7,.74);display:flex;align-items:flex-end;justify-content:center;padding:0 max(12px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-right,0px))}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--sheet);border-radius:26px;padding:22px 20px 20px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet h2{margin:0 0 8px;font-size:21px;font-weight:600}
.sheet p{margin:0 0 14px;color:var(--mute)}
.sheet p b{color:var(--fg);font-weight:600}
.sheet-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--mute);margin-bottom:6px;font-weight:500}
.field input[type=text],.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;color:var(--fg);resize:vertical}
.field textarea{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.err{color:var(--danger);font-size:13.5px;min-height:18px;margin:-6px 0 8px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;inset:0;margin:0}
.swatches span{display:block;width:36px;height:36px;border-radius:50%;border:3px solid transparent;background-clip:padding-box}
.swatches input:checked+span{border-color:var(--fg)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sheet h3{margin:20px 0 6px;font-size:15px;font-weight:600}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row .btn{flex:1;min-width:120px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 190px);z-index:70;background:#2E2338;color:var(--fg);padding:12px 18px;border-radius:16px;font-size:14.5px;max-width:min(90vw,460px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.toast[hidden]{display:none}
.warnbar{background:#3A2A18;color:var(--warn);border-radius:14px;padding:10px 14px;margin-top:12px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <main id="view"></main>
</div>

<div class="dock" id="dock">
  <div class="dock-in">
    <div id="miniWrap"></div>
    <form class="quick" id="quick" autocomplete="off">
      <input id="quickName" type="text" maxlength="60" placeholder="I'm working on…" aria-label="Task name">
      <button class="fab" type="submit" aria-label="Open stopwatch for this task"><svg class="ic f" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    </form>
    <nav class="nav" aria-label="Main">
      <button data-act="tab" data-v="timer" id="nav-timer"><span class="pill"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Timer</button>
      <button data-act="tab" data-v="calendar" id="nav-calendar"><span class="pill"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>Calendar</button>
      <button data-act="tab" data-v="reports" id="nav-reports"><span class="pill"><svg class="ic" viewBox="0 0 24 24"><path d="M6 20v-7M12 20V6M18 20v-10"/></svg></span>Reports</button>
    </nav>
  </div>
</div>

<section class="sw" id="stopwatch" hidden aria-label="Stopwatch"><div class="sw-in" id="swIn"></div></section>
<div class="scrim" id="modal" hidden data-act="close"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const PALETTE=['#C85BCB','#8E7CF0','#4DA3F5','#35C2B0','#7BD65A','#F2B84B','#F27C4B','#F25B7F'];
const NOCOLOR='#7A6F84';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const now=()=>Date.now();
const uid=()=>now().toString(36)+Math.random().toString(36).slice(2,9);
const ICONS={
  play:'<svg class="ic f" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg class="ic f" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  plus:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v9M7.5 12h9"/></svg>',
  gear:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a7.9 7.9 0 000-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 00-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 00-1.7 1l-2.3-.9-2 3.4 2 1.5a7.9 7.9 0 000 2l-2 1.5 2 3.4 2.3-.9c.5.4 1.1.7 1.7 1l.4 2.5h4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.3.9 2-3.4z"/></svg>',
  pencil:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trash:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>',
  left:'<svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  up:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg>',
  down:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></svg>',
  stop:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const ic=n=>ICONS[n]||'';

function hms(ms){const s=Math.floor(Math.max(0,ms)/1000);return Math.floor(s/3600)+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60);}
function hm(ms){if(ms>0&&ms<60000)return '<1m';const m=Math.floor(ms/60000);return Math.floor(m/60)+':'+p2(m%60);}
function lapFmt(ms){const c=Math.floor(ms%1000/10),s=Math.floor(ms/1000),h=Math.floor(s/3600);return (h?h+':':'')+p2(Math.floor(s%3600/60))+':'+p2(s%60)+'.'+p2(c);}
function swParts(ms){ms=Math.max(0,ms);return {h:p2(Math.floor(ms/3600000)),m:p2(Math.floor(ms%3600000/60000)),s:p2(Math.floor(ms%60000/1000)),c:p2(Math.floor(ms%1000/10))};}
function dayKey(ms){const d=new Date(ms);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function parseKey(k){const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(k,n){const d=parseKey(k);return dayKey(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n).getTime());}
function weekStart(k){const d=parseKey(k);const off=(d.getDay()+6)%7;return addDays(k,-off);}
function monthBounds(k){const d=parseKey(k);return {start:dayKey(new Date(d.getFullYear(),d.getMonth(),1).getTime()),end:dayKey(new Date(d.getFullYear(),d.getMonth()+1,0).getTime())};}
function keysBetween(a,b){const out=[];let k=a,guard=0;while(k<=b&&guard++<400){out.push(k);k=addDays(k,1);}return out;}
function fmtDate(k,opts){return parseKey(k).toLocaleDateString(undefined,opts);}
function fmtClock(ms){return new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}

/* ---------- state + storage ---------- */
const DB_NAME='timer-app-db',STORE='kv',LS_CORE='timer_core_v1',LS_SESS='timer_sessions_v1',LS_SEEN='timer_seen_v1',LS_PRE='timer_pre_import_v1';
let idb=null,storageMode='memory';
const data={tasks:[],sessions:[],open:[],settings:{}};
const ui={view:'timer',swTask:null,sort:'manual',reorder:false,cal:null,rep:null,lastSlow:0,day:'',lapsOpen:{},dlg:[],exportText:''};

function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));}catch(e){rej(e);}});}
function idbGet(k){return new Promise((res,rej)=>{const q=idb.transaction(STORE,'readonly').objectStore(STORE).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
function idbPut(k,v){return new Promise((res,rej)=>{const tx=idb.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}

function persist(sessionsChanged){
  const t=now();
  const core={v:1,tasks:data.tasks,open:data.open,settings:data.settings,savedAt:t};
  let lsOk=true;
  try{localStorage.setItem(LS_CORE,JSON.stringify(core));localStorage.setItem(LS_SEEN,String(t));}catch(e){lsOk=false;}
  if(sessionsChanged){
    try{const s=JSON.stringify(data.sessions);if(s.length<2200000)localStorage.setItem(LS_SESS,s);else localStorage.removeItem(LS_SESS);}catch(e){}
  }
  if(idb){
    idbPut('core',core).catch(()=>{});
    if(sessionsChanged)idbPut('sessions',data.sessions).catch(()=>{});
  }
  if(!idb&&!lsOk)storageMode='memory';
}

async function loadData(){
  let ic_=null,is_=null,lc=null,ls=null;
  try{idb=await openDB();ic_=await idbGet('core');is_=await idbGet('sessions');storageMode='indexeddb';}catch(e){idb=null;}
  let lsWorks=false;
  try{lc=JSON.parse(localStorage.getItem(LS_CORE)||'null');ls=JSON.parse(localStorage.getItem(LS_SESS)||'null');localStorage.setItem('timer_probe','1');localStorage.removeItem('timer_probe');lsWorks=true;}catch(e){}
  if(!idb)storageMode=lsWorks?'localstorage':'memory';
  let core=null,sess=null;
  if(ic_&&lc){if((lc.savedAt||0)>(ic_.savedAt||0)){core=lc;sess=ls||is_;}else{core=ic_;sess=is_||ls;}}
  else if(ic_){core=ic_;sess=is_||ls;}
  else if(lc){core=lc;sess=ls||is_;}
  if(core){
    data.tasks=Array.isArray(core.tasks)?core.tasks:[];
    data.open=Array.isArray(core.open)?core.open:[];
    data.settings=core.settings||{};
    data.sessions=Array.isArray(sess)?sess:[];
  }
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  persist(true);
}

/* ---------- stopwatch core (timestamp based) ---------- */
const task=id=>data.tasks.find(t=>t.id===id)||null;
const visibleTasks=()=>data.tasks.filter(t=>!t.deleted);
const runningSession=()=>data.open.find(s=>s.status==='running')||null;
const openFor=id=>data.open.find(s=>s.taskId===id)||null;
function elapsed(s,t){t=t==null?now():t;let sum=0;for(const g of s.segments)sum+=((g.end==null?t:g.end)-g.start);return Math.max(0,sum);}

function startTask(taskId){
  const run=runningSession();let s=openFor(taskId);
  if(run&&(!s||s.id!==run.id))return {conflict:run};
  const t=now();
  if(s){if(s.status==='paused'){s.segments.push({start:t,end:null});s.status='running';s.touched=t;}}
  else{s={id:uid(),taskId:taskId,status:'running',segments:[{start:t,end:null}],laps:[],touched:t};data.open.push(s);}
  persist();return {ok:true};
}
function pauseSession(s){if(s.status!=='running')return;const t=now();s.segments[s.segments.length-1].end=t;s.status='paused';s.touched=t;persist();}
function lapSession(s){if(s.status!=='running')return;const e=elapsed(s,now());const prev=s.laps.length?s.laps[s.laps.length-1].at:0;s.laps.push({at:e,split:e-prev});persist();}
function removeOpen(s){data.open=data.open.filter(x=>x.id!==s.id);}
function finishSession(s){
  const t=now();
  if(s.status==='running'){s.segments[s.segments.length-1].end=t;s.status='paused';}
  const dur=elapsed(s,t);
  removeOpen(s);
  if(dur<1000){persist();return {discarded:true};}
  const rec={id:s.id,taskId:s.taskId,start:s.segments[0].start,end:s.segments[s.segments.length-1].end,duration:dur,segments:s.segments,laps:s.laps};
  data.sessions.push(rec);persist(true);return {saved:rec};
}
function discardSession(s){removeOpen(s);persist();}

/* ---------- aggregation (per local day) ---------- */
function splitDays(segments,t){
  const out={};
  for(const g of segments){
    let s=g.start;const e=g.end==null?t:g.end;let guard=0;
    while(s<e&&guard++<3660){
      const d=new Date(s);const nd=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();
      const cut=Math.min(e,nd);const k=dayKey(s);out[k]=(out[k]||0)+(cut-s);s=cut;
    }
  }
  return out;
}
const dayCache=new Map();
function daysOf(s){let c=dayCache.get(s.id);if(!c){c=splitDays(s.segments,0);dayCache.set(s.id,c);}return c;}
function aggregate(t){
  const byDay={};
  const add=(days,id)=>{for(const k in days){const d=byDay[k]||(byDay[k]={total:0,tasks:{}});d.total+=days[k];d.tasks[id]=(d.tasks[id]||0)+days[k];}};
  for(const s of data.sessions)add(daysOf(s),s.taskId);
  for(const s of data.open)add(splitDays(s.segments,t),s.taskId);
  return {byDay:byDay};
}
function summarize(agg,keys){
  const byTask={};let total=0;
  const days=keys.map(k=>{const d=agg.byDay[k];const v=d?d.total:0;total+=v;if(d)for(const id in d.tasks)byTask[id]=(byTask[id]||0)+d.tasks[id];return {k:k,total:v};});
  return {total:total,byTask:byTask,days:days};
}
function sessionsOnDay(k,t){
  const out=[];
  for(const s of data.sessions){const ms=daysOf(s)[k];if(ms>0)out.push({id:s.id,taskId:s.taskId,ms:ms,start:s.start,end:s.end,laps:s.laps||[],saved:true});}
  for(const s of data.open){const ms=splitDays(s.segments,t)[k];if(ms>0)out.push({id:s.id,taskId:s.taskId,ms:ms,start:s.segments[0].start,end:s.status==='running'?t:s.segments[s.segments.length-1].end,laps:s.laps||[],saved:false,status:s.status});}
  return out.sort((a,b)=>a.start-b.start);
}
const tname=id=>{const t=task(id);return t?t.name:'Deleted task';};
const tcolor=id=>{const t=task(id);return t?t.color:NOCOLOR;};

/* ---------- toast / modal ---------- */
let toastTimer=null;
function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;},3200);}
function openModal(html){const m=$('#modal');m.innerHTML=html;m.hidden=false;const f=m.querySelector('input[type=text],textarea')||m.querySelector('button');if(f)setTimeout(()=>f.focus({preventScroll:true}),30);}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';}
function dialog(o){
  ui.dlg=o.actions;
  openModal('<div class="sheet" role="dialog" aria-modal="true"><h2>'+esc(o.title)+'</h2><p>'+o.body+'</p><div class="sheet-actions">'+
    o.actions.map((a,i)=>'<button class="btn '+(a.kind||'ghost')+'" data-act="dlg" data-i="'+i+'">'+esc(a.label)+'</button>').join('')+'</div></div>');
}

/* ---------- routing ---------- */
function go(view,taskId){
  if(view==='stopwatch'){if(!taskId||!task(taskId))return;ui.swTask=taskId;}
  ui.view=view;
  try{if(location.hash!=='#'+view)location.hash=view;}catch(e){}
  render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{
  let v='';try{v=location.hash.slice(1);}catch(e){}
  if(['timer','calendar','reports'].indexOf(v)>=0){if(v!==ui.view){ui.view=v;render();}}
  else if(v==='stopwatch'){if(ui.swTask&&ui.view!=='stopwatch'){ui.view='stopwatch';render();}}
  else if(!v&&ui.view==='stopwatch'){ui.view='timer';render();}
});

/* ---------- rendering ---------- */
function render(){
  const sw=ui.view==='stopwatch';
  $('#stopwatch').hidden=!sw;
  $('#app').hidden=sw;
  $('#dock').hidden=sw;
  if(sw){renderStopwatch();}
  else{renderMain();renderDock();}
  const s=sw?openFor(ui.swTask):null;
  if(s&&s.status==='running')acquireWake();else releaseWake();
}
function renderDock(){
  ['timer','calendar','reports'].forEach(v=>{const b=$('#nav-'+v);b.classList.toggle('on',ui.view===v);b.setAttribute('aria-current',ui.view===v?'page':'false');});
  $('#quick').hidden=ui.view!=='timer';
  const m=miniSession();
  if(m){
    const st=m.status;
    $('#miniWrap').innerHTML='<button class="mini '+st+'" data-act="openMini" aria-label="Open stopwatch"><span class="pulse '+(st==='running'?'run':'')+'"></span><span class="nm">'+esc(tname(m.taskId))+'</span><span class="tm num" id="miniTime">'+hms(elapsed(m))+'</span><span class="go">'+(st==='running'?'Open':'Paused')+'</span></button>';
  }else $('#miniWrap').innerHTML='';
}
function miniSession(){const r=runningSession();if(r)return r;let best=null;for(const s of data.open)if(!best||(s.touched||0)>(best.touched||0))best=s;return best;}
function renderMain(){
  const v=$('#view');
  if(ui.view==='timer')v.innerHTML=timerHTML();
  else if(ui.view==='calendar')v.innerHTML=calendarHTML();
  else v.innerHTML=reportsHTML();
}

/* ----- Timer dashboard ----- */
function timerHTML(){
  const t=now(),agg=aggregate(t),tk=dayKey(t),today=agg.byDay[tk]||{total:0,tasks:{}};
  ui.day=tk;
  let list=visibleTasks();
  const mode=ui.reorder?'manual':(data.settings.sort||'manual');
  if(mode==='today')list=list.slice().sort((a,b)=>(today.tasks[b.id]||0)-(today.tasks[a.id]||0));
  else if(mode==='name')list=list.slice().sort((a,b)=>a.name.localeCompare(b.name));
  let h='<header class="top"><div><h1>Timer</h1><div class="date" id="dateLine">'+esc(fmtDate(tk,{weekday:'long',day:'numeric',month:'long',year:'numeric'}))+'</div></div>'+
    '<div class="top-actions"><button class="icon-btn" data-act="newTask" aria-label="New task">'+ic('plus')+'</button><button class="icon-btn" data-act="settings" aria-label="Backup and data">'+ic('gear')+'</button></div></header>'+
    '<div class="tabs-line"></div>'+
    '<div class="today-row"><span>TODAY</span><b class="num" id="todayTotal">'+hms(today.total)+'</b></div>';
  if(storageMode==='memory')h+='<div class="warnbar">Storage is blocked in this browser, so data will be lost when the page closes. Allow site data, then reload.</div>';
  if(list.length>1){
    h+='<div class="tools">'+[['manual','Manual'],['today','Most today'],['name','A–Z']].map(x=>'<button class="chip '+(mode===x[0]?'on':'')+'" data-act="sort" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+
      '<span class="grow"></span><button class="chip '+(ui.reorder?'on':'')+'" data-act="reorder">'+(ui.reorder?'Done':'Reorder')+'</button></div>';
  }
  if(!list.length){
    h+='<div class="empty"><h2>No tasks yet</h2><p>Create a task for something you want to track, then open its stopwatch. Time is saved to the task each time you stop.</p><button class="btn primary" data-act="newTask">Create a task</button></div>';
  }
  list.forEach((tsk,i)=>{
    const s=openFor(tsk.id);

    const acts=ui.reorder
      ?'<button class="icon-btn" data-act="up" data-id="'+tsk.id+'" aria-label="Move up"'+(i===0?' disabled':'')+'>'+ic('up')+'</button><button class="icon-btn" data-act="down" data-id="'+tsk.id+'" aria-label="Move down"'+(i===list.length-1?' disabled':'')+'>'+ic('down')+'</button>'
      :'<button class="icon-btn" data-act="editTask" data-id="'+tsk.id+'" aria-label="Edit '+esc(tsk.name)+'">'+ic('pencil')+'</button><button class="icon-btn" data-act="delTask" data-id="'+tsk.id+'" aria-label="Delete '+esc(tsk.name)+'">'+ic('trash')+'</button>';
    h+='<article class="card"><div style="min-width:0"><h3><span class="dot" style="background:'+tsk.color+'"></span><span class="nm">'+esc(tsk.name)+'</span></h3>'+
      (tsk.desc?'<div class="desc">'+esc(tsk.desc)+'</div>':'')+(st?'<div style="margin-top:4px">'+st+'</div>':'')+'</div>'+
      '<div class="time num" data-live="'+tsk.id+'">'+hms(today.tasks[tsk.id]||0)+'</div>'+
      '<div class="row2"><span></span><div class="card-acts">'+acts+'<button class="play" data-act="play" data-id="'+tsk.id+'" aria-label="Open stopwatch for '+esc(tsk.name)+'">'+ic('play')+'</button></div></div></article>';

/* ----- Stopwatch ----- */
function swTimeHTML(ms){const p=swParts(ms);return '<span id="swH">'+p.h+'</span><i>:</i><span id="swM">'+p.m+'</span><i>:</i><span id="swS">'+p.s+'</span><i>.</i><span id="swC">'+p.c+'</span>';}
function updateSwTime(ms){
  const p=swParts(ms),a=[['swH',p.h],['swM',p.m],['swS',p.s],['swC',p.c]];
  for(const x of a){const el=document.getElementById(x[0]);if(el&&el.textContent!==x[1])el.textContent=x[1];}
}
function renderStopwatch(){
  const tk=task(ui.swTask);
  if(!tk){ui.view='timer';render();return;}
  const s=openFor(tk.id),st=s?s.status:'idle',e=s?elapsed(s):0,laps=s?s.laps:[];
  const stateLabel=st==='running'?'Running':st==='paused'?'Paused':'Ready';
  let lapsHTML='';
  if(laps.length){
    lapsHTML='<li class="hd"><span>Lap</span><span class="sp">Split</span><span class="c">Total</span></li>';
    for(let i=laps.length-1;i>=0;i--)lapsHTML+='<li><span class="n">'+(i+1)+'</span><span class="sp">'+lapFmt(laps[i].split)+'</span><span class="c">'+lapFmt(laps[i].at)+'</span></li>';
  }else lapsHTML='<li class="none">Laps appear here</li>';
  const left=st==='paused'?'<button class="pillbtn l" data-act="swReset">Reset</button>':'<button class="pillbtn l" data-act="swLap"'+(st==='running'?'':' disabled')+'>Lap</button>';
  const right='<button class="pillbtn r" data-act="swMain">'+(st==='running'?'Pause':st==='paused'?'Resume':'Start')+'</button>';
  $('#swIn').innerHTML=
    '<div class="sw-top"><button class="icon-btn" data-act="swBack" aria-label="Back to tasks">'+ic('left')+'</button>'+
    '<div class="sw-task"><span class="dot" style="background:'+tk.color+'"></span><span class="nm">'+esc(tk.name)+'</span></div><span class="sw-spacer"></span></div>'+
    '<div class="sw-center"><div class="sw-time" id="swTime">'+swTimeHTML(e)+'</div><div class="sw-state '+st+'"><span class="pulse"></span>'+stateLabel+'</div></div>'+
    '<ol class="laps" aria-label="Laps">'+lapsHTML+'</ol>'+
    '<div class="sw-ctl">'+left+right+'</div>'+
    '<div class="sw-foot"><button class="sw-save" data-act="swSave"'+(s&&e>=0&&st!=='idle'?'':' hidden')+'>'+ic('stop')+'Stop &amp; save</button></div>';
}
function swMain(){
  const tk=task(ui.swTask);if(!tk)return;const s=openFor(tk.id);
  if(s&&s.status==='running'){pauseSession(s);renderStopwatch();releaseWake();return;}
  const r=startTask(tk.id);
  if(r.conflict){conflictDialog(r.conflict,tk);return;}
  renderStopwatch();acquireWake();
}
function conflictDialog(run,tk){
  const nm=tname(run.taskId);
  dialog({title:'Another task is running',body:'<b>'+esc(nm)+'</b> is still running ('+hms(elapsed(run))+'). Only one task can be tracked at a time.',actions:[
    {label:'Pause “'+nm+'” and start',kind:'primary',fn:()=>{pauseSession(run);startTask(tk.id);renderStopwatch();acquireWake();}},
    {label:'Finish & save “'+nm+'”, then start',kind:'ghost',fn:()=>{finishToast(run);startTask(tk.id);renderStopwatch();acquireWake();}},
    {label:'Cancel',kind:'quiet',fn:()=>{}}]});
}
function finishToast(s){
  const name=tname(s.taskId),r=finishSession(s);
  if(r.saved)toast('Saved '+hms(r.saved.duration)+' to '+name);
  else toast('Under 1 second, nothing saved');
}
function swSave(){
  const s=openFor(ui.swTask);if(!s)return;
  finishToast(s);renderStopwatch();releaseWake();
}
function swReset(){
  const s=openFor(ui.swTask);if(!s)return;
  const e=elapsed(s);
  if(e<1000){discardSession(s);renderStopwatch();return;}
  dialog({title:'Reset the stopwatch?',body:'<b>'+hms(e)+'</b> on '+esc(tname(s.taskId))+' has not been saved yet.',actions:[
    {label:'Save it instead',kind:'primary',fn:()=>{swSave();}},
    {label:'Discard and reset',kind:'danger',fn:()=>{const x=openFor(ui.swTask);if(x)discardSession(x);renderStopwatch();toast('Stopwatch reset');}},
    {label:'Cancel',kind:'quiet',fn:()=>{}}]});
}

/* ----- wake lock ----- */
let wake=null;
async function acquireWake(){try{if(!('wakeLock' in navigator)||wake)return;wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}catch(e){wake=null;}}
function releaseWake(){try{if(wake)wake.release();}catch(e){}wake=null;}

/* ----- Calendar ----- */

  let max=0,monthTotal=0;
  for(let d=1;d<=dim;d++){const k=c.y+'-'+p2(c.m+1)+'-'+p2(d);const v=agg.byDay[k]?agg.byDay[k].total:0;monthTotal+=v;if(v>max)max=v;}
  const label=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const dows=[0,1,2,3,4,5,6].map(i=>new Date(2024,0,1+i).toLocaleDateString(undefined,{weekday:'short'}).slice(0,2).toUpperCase());

    '<div class="dow">'+dows.map(d=>'<span>'+d+'</span>').join('')+'</div><div class="grid">';

  for(let d=1;d<=dim;d++){
    const k=c.y+'-'+p2(c.m+1)+'-'+p2(d),v=agg.byDay[k]?agg.byDay[k].total:0;
    const a=v>0?(0.12+0.4*(v/max)).toFixed(2):0;
    h+='<button class="day'+(k===tk?' today':'')+(k===c.sel?' sel':'')+'" data-act="calSel" data-k="'+k+'" style="'+(v>0?'background:rgba(200,91,203,'+a+')':'')+'" aria-label="'+esc(fmtDate(k,{day:'numeric',month:'long'}))+', '+(v>0?hms(v):'nothing tracked')+'"><b style="font-weight:500">'+d+'</b><small>'+(v>0?hm(v):'')+'</small></button>';
  }
  h+='</div>';
  h+=dayPanel(c.sel,agg,t);
  return h;
}
function dayPanel(k,agg,t){
  const d=agg.byDay[k],list=sessionsOnDay(k,t);
  let h='<section class="panel"><h2>'+esc(fmtDate(k,{weekday:'long',day:'numeric',month:'long'}))+'</h2>';
  if(!d||!d.total){return h+'<div class="note">Nothing tracked on this day.</div></section>';}
  h+='<div class="total-line"><span class="sub">Daily total</span><b class="num">'+hms(d.total)+'</b></div>';
  const rows=Object.keys(d.tasks).map(id=>({id:id,ms:d.tasks[id]})).sort((a,b)=>b.ms-a.ms);
  h+='<ul class="list">'+rows.map(r=>'<li><span class="dot" style="background:'+tcolor(r.id)+'"></span><span class="nm">'+esc(tname(r.id))+'</span><span class="v num">'+hms(r.ms)+'</span></li>').join('')+'</ul>';
  h+='<h2 style="margin-top:22px;font-size:16px;color:var(--mute);font-weight:500">Sessions</h2>';
  list.forEach(s=>{
    const startDay=dayKey(s.start),endDay=dayKey(s.end);
    let note=fmtClock(s.start)+' – '+fmtClock(s.end);
    if(startDay<k)note='Started '+fmtDate(startDay,{day:'numeric',month:'short'})+' · until '+fmtClock(s.end);
    else if(endDay>k)note=fmtClock(s.start)+' · continues next day';
    const tag=s.saved?'':'<span class="tag '+s.status+'">'+(s.status==='running'?'Running':'Paused')+'</span> ';
    const hasLaps=s.laps.length>0,open=ui.lapsOpen[s.id];
    h+='<div class="sess"><div class="sess-h"><span class="dot" style="background:'+tcolor(s.taskId)+'"></span><div class="nm"><b>'+esc(tname(s.taskId))+'</b><small>'+tag+esc(note)+(hasLaps?' · '+s.laps.length+' lap'+(s.laps.length>1?'s':''):'')+'</small></div><span class="v num">'+hms(s.ms)+'</span>'+
      (hasLaps?'<button class="icon-btn" data-act="toggleLaps" data-id="'+s.id+'" aria-label="Show laps">'+ic(open?'up':'down')+'</button>':'')+
      (s.saved?'<button class="icon-btn" data-act="delSess" data-id="'+s.id+'" aria-label="Delete session">'+ic('trash')+'</button>':'')+'</div>';
    if(hasLaps&&open)h+='<ul class="lapl">'+s.laps.map((l,i)=>'<li><span>Lap '+(i+1)+'</span><span>'+lapFmt(l.split)+' · '+lapFmt(l.at)+'</span></li>').join('')+'</ul>';
    h+='</div>';
  });
  return h+'</section>';
}

/* ----- Reports ----- */
function periodBounds(mode,key){
  if(mode==='day')return {start:key,end:key};
  if(mode==='week'){const s=weekStart(key);return {start:s,end:addDays(s,6)};}
  return monthBounds(key);
}
function repShift(dir){
  const r=ui.rep,d=parseKey(r.key);let n;
  if(r.mode==='day')n=new Date(d.getFullYear(),d.getMonth(),d.getDate()+dir);
  else if(r.mode==='week')n=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7*dir);
  else n=new Date(d.getFullYear(),d.getMonth()+dir,1);
  r.key=dayKey(n.getTime());renderMain();
}
function niceScale(maxMs){
  const steps=[5,10,15,30,60,120,180,240,360,480,720,1440].map(m=>m*60000);
  let step=steps[steps.length-1];
  for(const s of steps){if(maxMs/s<=4){step=s;break;}}
  return {step:step,max:Math.max(step,Math.ceil(maxMs/step)*step)};
}
function tickLabel(ms){if(ms===0)return '0';return ms>=3600000?(ms/3600000)+'h':(ms/60000)+'m';}
function barChart(o){
  const W=340,H=176,L=34,R=6,T=16,B=24,pw=W-L-R,ph=H-T-B;
  const all=o.values.concat(o.prev||[]);const sc=niceScale(Math.max(1,...all));
  const n=o.values.length,slot=pw/n;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">';
  for(let v=0;v<=sc.max;v+=sc.step){
    const y=T+ph-(v/sc.max)*ph;
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="'+(v===0?'#4A3E55':'#2B2235')+'" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+tickLabel(v)+'</text>';
  }
  for(let i=0;i<n;i++){
    const cx=L+i*slot+slot/2;
    let bw=o.prev?Math.min(slot*0.36,16):Math.min(slot*0.64,28);
    const draw=(v,x,w,fill)=>{if(v<=0)return '';const h=Math.max(2,(v/sc.max)*ph);return '<rect x="'+x.toFixed(1)+'" y="'+(T+ph-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+Math.min(3,w/2).toFixed(1)+'" fill="'+fill+'"/>';};
    if(o.prev){s+=draw(o.prev[i],cx-bw-1,bw,'#4A3E55')+draw(o.values[i],cx+1,bw,'#C85BCB');}
    else{s+=draw(o.values[i],cx-bw/2,bw,o.hl&&o.hl===i?'#E9A5EB':'#C85BCB');
      if(o.vals&&o.values[i]>0){const h=(o.values[i]/sc.max)*ph;s+='<text class="val" x="'+cx.toFixed(1)+'" y="'+(T+ph-h-4).toFixed(1)+'" text-anchor="middle">'+hm(o.values[i])+'</text>';}}
    if(i%(o.every||1)===0)s+='<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(o.labels[i])+'</text>';
  }
  return s+'</svg>';
}
function donut(rows,total){
  if(rows.length>8){const top=rows.slice(0,7),rest=rows.slice(7).reduce((a,r)=>a+r.ms,0);rows=top.concat([{id:'_other',ms:rest,color:NOCOLOR}]);}
  const R=46,C=2*Math.PI*R;let off=0,segs='';
  rows.forEach(r=>{
    const len=(r.ms/total)*C,gap=rows.length>1?Math.min(2,len*0.3):0,dash=Math.max(0.01,len-gap);
    segs+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+(r.color||tcolor(r.id))+'" stroke-width="16" stroke-dasharray="'+dash.toFixed(2)+' '+(C-dash).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"/>';
    off+=len;
  });
  return '<div class="donut-wrap"><svg viewBox="0 0 120 120" role="img" aria-label="Time distribution by task">'+segs+'<text x="60" y="62">'+hms(total)+'</text><text class="s" x="60" y="74">tracked</text></svg></div>';
}
function distribution(byTask,total){
  if(!total)return '<div class="note">No time tracked in this period.</div>';
  const rows=Object.keys(byTask).map(id=>({id:id,ms:byTask[id]})).filter(r=>r.ms>0).sort((a,b)=>b.ms-a.ms);
  return donut(rows,total)+'<ul class="list">'+rows.map(r=>'<li><span class="dot" style="background:'+tcolor(r.id)+'"></span><span class="nm">'+esc(tname(r.id))+'</span><span class="v num">'+hms(r.ms)+'</span><span class="pc">'+Math.round(r.ms/total*100)+'%</span></li>').join('')+'</ul>';
}
function deltaHTML(cur,prev,suffix){
  const d=cur-prev;if(Math.abs(d)<1000)return '<span class="d">same'+suffix+'</span>';
  return '<span class="d '+(d>0?'up':'dn')+'">'+(d>0?'+':'−')+hms(Math.abs(d))+suffix+'</span>';
}
function reportsHTML(){
  const t=now(),agg=aggregate(t),tk=dayKey(t),r=ui.rep,b=periodBounds(r.mode,r.key);
  const keys=keysBetween(b.start,b.end),sum=summarize(agg,keys);
  const canNext=addDays(b.end,1)<=tk;
  let label;
  if(r.mode==='day')label=r.key===tk?'Today':fmtDate(r.key,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  else if(r.mode==='week')label=fmtDate(b.start,{day:'numeric',month:'short'})+' – '+fmtDate(b.end,{day:'numeric',month:'short'})+(b.start<=tk&&tk<=b.end?' · this week':'');
  else label=fmtDate(b.start,{month:'long',year:'numeric'});
  let h='<div class="sec-title"><h1>Reports</h1></div>'+
    '<div class="seg" role="tablist">'+[['day','Day'],['week','Week'],['month','Month']].map(x=>'<button class="'+(r.mode===x[0]?'on':'')+'" data-act="repMode" data-v="'+x[0]+'" role="tab" aria-selected="'+(r.mode===x[0])+'">'+x[1]+'</button>').join('')+'</div>'+
    '<div class="nav-row"><button class="icon-btn" data-act="repPrev" aria-label="Previous period">'+ic('left')+'</button><div class="lbl">'+esc(label)+'</div><button class="icon-btn" data-act="repNext" aria-label="Next period"'+(canNext?'':' disabled')+'>'+ic('right')+'</button></div>';

  if(r.mode==='day'){
    h+='<div class="stats"><div class="stat wide"><span>Total tracked</span><b>'+hms(sum.total)+'</b></div></div>';
    h+='<section class="panel"><h2>Time by task</h2>'+distribution(sum.byTask,sum.total)+'</section>';
  }
  else if(r.mode==='week'){
    const pk=keysBetween(addDays(b.start,-7),addDays(b.start,-1)),ps=summarize(agg,pk);
    const names=sum.days.map(d=>fmtDate(d.k,{weekday:'short'}).slice(0,3));
    let best=null;sum.days.forEach((d,i)=>{if(d.total>0&&(!best||d.total>best.total))best={total:d.total,i:i};});
    const elapsedDays=Math.max(1,Math.min(7,keys.filter(k=>k<=tk).length));
    h+='<div class="stats"><div class="stat wide"><span>Total tracked</span><b>'+hms(sum.total)+'</b>'+deltaHTML(sum.total,ps.total,' vs previous week')+'</div>'+
      '<div class="stat"><span>Daily average</span><b>'+hms(sum.total/elapsedDays)+'</b></div>'+
      '<div class="stat"><span>Busiest day</span><b>'+(best?esc(names[best.i]):'–')+'</b>'+(best?'<span class="d">'+hms(best.total)+'</span>':'')+'</div></div>';
    h+='<section class="panel"><h2>Days</h2><div class="chartbox">'+barChart({values:sum.days.map(d=>d.total),prev:ps.days.map(d=>d.total),labels:names,aria:'Tracked time per day, this week and previous week'})+'</div>'+
      '<div class="legend"><span><i style="background:#C85BCB"></i>This week</span><span><i style="background:#4A3E55"></i>Previous week</span></div>'+
      sum.days.map((d,i)=>'<div class="dl"><span>'+names[i]+'</span><span>'+hms(d.total)+'</span>'+deltaHTMLShort(d.total,ps.days[i].total)+'</div>').join('')+'</section>';
    h+='<section class="panel"><h2>Most time-consuming</h2>'+distribution(sum.byTask,sum.total)+'</section>';
  }
  else{
    const active=sum.days.filter(d=>d.total>0).length,elapsedDays=Math.max(1,keys.filter(k=>k<=tk).length);
    h+='<div class="stats"><div class="stat wide"><span>Total tracked</span><b>'+hms(sum.total)+'</b></div>'+
      '<div class="stat"><span>Active days</span><b>'+active+'</b></div><div class="stat"><span>Daily average</span><b>'+hms(sum.total/elapsedDays)+'</b></div></div>';
    h+='<section class="panel"><h2>Time by task</h2>'+distribution(sum.byTask,sum.total)+'</section>';
    h+='<section class="panel"><h2>Daily trend</h2><div class="chartbox">'+barChart({values:sum.days.map(d=>d.total),labels:sum.days.map((d,i)=>String(i+1)),every:5,aria:'Tracked time per day this month'})+'</div></section>';
    let wk='',ws=weekStart(b.start),maxW=1;const weeks=[];
    while(ws<=b.end){const a=ws<b.start?b.start:ws,e=addDays(ws,6)>b.end?b.end:addDays(ws,6);const sm=summarize(agg,keysBetween(a,e));weeks.push({a:a,e:e,total:sm.total});if(sm.total>maxW)maxW=sm.total;ws=addDays(ws,7);}
    weeks.forEach(w=>{wk+='<div class="wk"><div class="r"><span>'+esc(fmtDate(w.a,{day:'numeric',month:'short'})+' – '+fmtDate(w.e,{day:'numeric',month:'short'}))+'</span><span class="num">'+hms(w.total)+'</span></div><div class="hbar"><i style="width:'+(w.total/maxW*100).toFixed(1)+'%"></i></div></div>';});
    h+='<section class="panel"><h2>Weekly trend</h2><div style="margin-top:6px">'+wk+'</div></section>';
  }
  return h;
}
function deltaHTMLShort(cur,prev){
  const d=cur-prev;if(Math.abs(d)<60000)return '<span class="d">–</span>';
  return '<span class="d '+(d>0?'up':'dn')+'">'+(d>0?'+':'−')+hm(Math.abs(d))+'</span>';
}

/* ---------- task forms ---------- */
function taskForm(id){
  const t=id?task(id):null;
  const col=t?t.color:PALETTE[visibleTasks().length%PALETTE.length];
  openModal('<form class="sheet" id="taskForm" data-id="'+(id||'')+'" role="dialog" aria-modal="true"><h2>'+(t?'Edit task':'New task')+'</h2>'+
    '<label class="field"><span>Name</span><input type="text" id="tfName" maxlength="60" value="'+esc(t?t.name:'')+'" autocomplete="off"></label>'+
    '<div class="err" id="tfErr" role="alert"></div>'+

function submitTask(form){
  const name=$('#tfName').value.trim();
  if(!name){$('#tfErr').textContent='Give the task a name.';$('#tfName').focus();return;}
  const desc=$('#tfDesc').value.trim(),color=(form.querySelector('input[name=tfColor]:checked')||{}).value||PALETTE[0],id=form.dataset.id;
  if(id){const t=task(id);if(t){t.name=name;t.desc=desc;t.color=color;}toast('Task updated');}
  else{data.tasks.push({id:uid(),name:name,desc:desc,color:color,created:now()});toast('Task created');}
  persist();closeModal();render();
}
function deleteTask(id){
  const t=task(id);if(!t)return;
  if(openFor(id)){dialog({title:'Finish the session first',body:'<b>'+esc(t.name)+'</b> has an unsaved stopwatch session. Open its stopwatch and choose Stop &amp; save, or Reset, then delete the task.',actions:[
    {label:'Open stopwatch',kind:'primary',fn:()=>go('stopwatch',id)},{label:'Cancel',kind:'quiet',fn:()=>{}}]});return;}
  const n=data.sessions.filter(s=>s.taskId===id).length,tot=data.sessions.filter(s=>s.taskId===id).reduce((a,s)=>a+s.duration,0);
  const actions=[];
  if(n)actions.push({label:'Delete task, keep its history',kind:'primary',fn:()=>{t.deleted=true;persist();render();toast('Task deleted, history kept');}});
  actions.push({label:n?'Delete task and its '+n+' session'+(n>1?'s':''):'Delete task',kind:'danger',fn:()=>{
    data.tasks=data.tasks.filter(x=>x.id!==id);data.sessions=data.sessions.filter(s=>s.taskId!==id);persist(true);render();toast('Task deleted');}});
  actions.push({label:'Cancel',kind:'quiet',fn:()=>{}});
  dialog({title:'Delete “'+t.name+'”?',body:n?'It has '+n+' saved session'+(n>1?'s':'')+' ('+hms(tot)+' in total). You can keep that history in Calendar and Reports, or remove it with the task.':'This task has no tracked time.',actions:actions});
}
function moveTask(id,dir){
  const vis=visibleTasks(),i=vis.findIndex(t=>t.id===id),j=i+dir;
  if(i<0||j<0||j>=vis.length)return;
  const a=data.tasks.indexOf(vis[i]),b=data.tasks.indexOf(vis[j]);
  const tmp=data.tasks[a];data.tasks[a]=data.tasks[b];data.tasks[b]=tmp;persist();render();
}

/* ---------- backup ---------- */
function backupObject(){return {app:'timer',version:1,exportedAt:now(),tasks:data.tasks,sessions:data.sessions,open:data.open};}
function validBackup(o){
  const okSeg=g=>g&&Number.isFinite(g.start)&&(g.end==null||Number.isFinite(g.end));
  return !!(o&&Array.isArray(o.tasks)&&Array.isArray(o.sessions)&&
    o.tasks.every(t=>t&&typeof t.id==='string'&&typeof t.name==='string')&&
    o.sessions.every(s=>s&&typeof s.id==='string'&&typeof s.taskId==='string'&&Array.isArray(s.segments)&&s.segments.length&&s.segments.every(g=>okSeg(g)&&g.end!=null))&&
    (o.open==null||(Array.isArray(o.open)&&o.open.every(s=>s&&typeof s.id==='string'&&typeof s.taskId==='string'&&Array.isArray(s.segments)&&s.segments.every(okSeg)))));
}
function settingsHTML(){
  const modeTxt=storageMode==='indexeddb'?'Saved in this browser (IndexedDB, with a localStorage mirror).':storageMode==='localstorage'?'Saved in this browser (localStorage).':'Not saved. Storage is blocked in this browser.';
  return '<div class="sheet" role="dialog" aria-modal="true"><h2>Backup &amp; data</h2>'+
    '<p>'+esc(modeTxt)+' It stays on this device and this browser profile only. Copy a backup now and then.</p>'+
    '<p class="num"><b>'+visibleTasks().length+'</b> tasks · <b>'+data.sessions.length+'</b> saved sessions</p>'+
    '<h3>Export</h3><div class="row"><button class="btn ghost" data-act="exportShow">Show backup data</button></div>'+
    (ui.exportText?'<label class="field" style="margin-top:12px"><span>Backup (JSON)</span><textarea id="exportBox" readonly>'+esc(ui.exportText)+'</textarea></label><div class="row"><button class="btn primary" data-act="exportCopy">Copy to clipboard</button></div>':'')+
    '<h3>Restore</h3><label class="field"><span>Paste a backup or choose a file</span><textarea id="importBox" placeholder="{ &quot;app&quot;: &quot;timer&quot;, … }"></textarea></label>'+
    '<div class="row"><input type="file" id="importFile" accept=".json,application/json,text/plain" style="flex:1;min-width:0;color:var(--mute)"></div>'+
    '<div class="err" id="impErr" role="alert" style="margin-top:8px"></div>'+
    '<div class="row"><button class="btn ghost" data-act="importGo" data-v="merge">Merge</button><button class="btn danger" data-act="importGo" data-v="replace">Replace all</button></div>'+
    '<div class="sheet-actions" style="margin-top:14px"><button class="btn quiet" data-act="close-btn">Close</button></div></div>';
}
function doImport(mode){
  const err=$('#impErr');err.textContent='';
  let o;try{o=JSON.parse($('#importBox').value);}catch(e){err.textContent='That is not valid JSON. Paste the full backup text.';return;}
  if(!validBackup(o)){err.textContent='This does not look like a Timer backup.';return;}
  const exp=o.exportedAt||now();
  (o.open||[]).forEach(s=>{if(s.status==='running'){const g=s.segments[s.segments.length-1];if(g.end==null)g.end=Math.max(g.start,exp);s.status='paused';}s.laps=s.laps||[];});
  const nt=o.tasks.length,ns=o.sessions.length;
  const apply=()=>{
    try{localStorage.setItem(LS_PRE,JSON.stringify({core:{tasks:data.tasks,open:data.open,settings:data.settings},sessions:data.sessions.length<8000?data.sessions:[]}));}catch(e){}
    if(mode==='replace'){data.tasks=o.tasks;data.sessions=o.sessions;data.open=o.open||[];dayCache.clear();}
    else{
      const tid=new Set(data.tasks.map(t=>t.id)),sid=new Set(data.sessions.map(s=>s.id)),oid=new Set(data.open.map(s=>s.id));
      o.tasks.forEach(t=>{if(!tid.has(t.id))data.tasks.push(t);});
      o.sessions.forEach(s=>{if(!sid.has(s.id)&&!oid.has(s.id))data.sessions.push(s);});
      (o.open||[]).forEach(s=>{if(!oid.has(s.id)&&!sid.has(s.id)&&!openFor(s.taskId))data.open.push(s);});
    }
    persist(true);closeModal();render();toast('Backup restored');
  };
  dialog({title:mode==='replace'?'Replace all current data?':'Merge this backup?',
    body:mode==='replace'?'Your current '+data.sessions.length+' sessions will be replaced by the backup ('+nt+' tasks, '+ns+' sessions). A copy of the current data is kept in this browser.':'Tasks and sessions from the backup ('+nt+' tasks, '+ns+' sessions) are added. Anything already here stays.',
    actions:[{label:mode==='replace'?'Replace everything':'Merge',kind:mode==='replace'?'danger':'primary',fn:apply},{label:'Cancel',kind:'quiet',fn:()=>{ui.exportText='';openModal(settingsHTML());}}]});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  switch(act){
    case 'close':if(e.target===b)closeModal();break;
    case 'close-btn':closeModal();break;
    case 'dlg':{const a=ui.dlg[+b.dataset.i];closeModal();if(a&&a.fn)a.fn();break;}
    case 'tab':go(b.dataset.v);break;
    case 'newTask':taskForm(null);break;
    case 'editTask':taskForm(id);break;
    case 'delTask':deleteTask(id);break;
    case 'play':go('stopwatch',id);break;
    case 'up':moveTask(id,-1);break;
    case 'down':moveTask(id,1);break;
    case 'sort':data.settings.sort=b.dataset.v;persist();renderMain();break;
    case 'reorder':ui.reorder=!ui.reorder;renderMain();break;
    case 'settings':ui.exportText='';openModal(settingsHTML());break;
    case 'openMini':{const m=miniSession();if(m&&task(m.taskId))go('stopwatch',m.taskId);break;}
    case 'swBack':go('timer');break;
    case 'swMain':swMain();break;
    case 'swLap':{const s=openFor(ui.swTask);if(s){lapSession(s);renderStopwatch();}break;}
    case 'swReset':swReset();break;
    case 'swSave':swSave();break;
    case 'calPrev':{const c=ui.cal;c.m--;if(c.m<0){c.m=11;c.y--;}renderMain();break;}
    case 'calNext':{const c=ui.cal;c.m++;if(c.m>11){c.m=0;c.y++;}renderMain();break;}
    case 'calSel':ui.cal.sel=b.dataset.k;renderMain();break;
    case 'toggleLaps':ui.lapsOpen[id]=!ui.lapsOpen[id];renderMain();break;
    case 'delSess':{
      const s=data.sessions.find(x=>x.id===id);if(!s)break;
      dialog({title:'Delete this session?',body:'<b>'+esc(tname(s.taskId))+'</b> · '+hms(s.duration)+' on '+esc(fmtDate(dayKey(s.start),{day:'numeric',month:'long'}))+'. This cannot be undone.',actions:[
        {label:'Delete session',kind:'danger',fn:()=>{data.sessions=data.sessions.filter(x=>x.id!==id);dayCache.delete(id);persist(true);renderMain();toast('Session deleted');}},
        {label:'Cancel',kind:'quiet',fn:()=>{}}]});break;}
    case 'repMode':ui.rep.mode=b.dataset.v;renderMain();break;
    case 'repPrev':repShift(-1);break;
    case 'repNext':if(!b.disabled)repShift(1);break;
    case 'exportShow':ui.exportText=JSON.stringify(backupObject());openModal(settingsHTML());{const x=$('#exportBox');if(x){x.focus();x.select();}}break;
    case 'exportCopy':{
      const x=$('#exportBox');
      const fallback=()=>{if(x){x.focus();x.select();}toast('Press and hold to copy the selected text');};
      try{navigator.clipboard.writeText(ui.exportText).then(()=>toast('Backup copied'),fallback);}catch(err){fallback();}
      break;}
    case 'importGo':doImport(b.dataset.v);break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='taskForm')submitTask(e.target);
  else if(e.target.id==='quick'){
    const inp=$('#quickName'),name=inp.value.trim();if(!name){inp.focus();return;}
    let t=visibleTasks().find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!t){t={id:uid(),name:name,desc:'',color:PALETTE[visibleTasks().length%PALETTE.length],created:now()};data.tasks.push(t);persist();toast('Task created');}
    inp.value='';go('stopwatch',t.id);
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='importFile'&&e.target.files&&e.target.files[0]){
    const r=new FileReader();r.onload=()=>{const b=$('#importBox');if(b)b.value=String(r.result||'');};r.onerror=()=>{const x=$('#impErr');if(x)x.textContent='Could not read that file.';};r.readAsText(e.target.files[0]);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return;}
  if(ui.view==='stopwatch'&&$('#modal').hidden&&!/INPUT|TEXTAREA|BUTTON/.test((e.target.tagName||''))){
    if(e.code==='Space'){e.preventDefault();swMain();}
    else if(e.key==='l'||e.key==='L'){const s=openFor(ui.swTask);if(s&&s.status==='running'){lapSession(s);renderStopwatch();}}
  }
});

/* ---------- live updates ---------- */
function tick(){
  const t=now();
  if(ui.view==='stopwatch'){const s=openFor(ui.swTask);updateSwTime(s?elapsed(s,t):0);return;}
  if(t-ui.lastSlow<250)return;
  ui.lastSlow=t;slowTick(t);
}
function slowTick(t){
  if(dayKey(t)!==ui.day){ui.day=dayKey(t);render();return;}
  const m=$('#miniTime');if(m){const s=miniSession();if(s)m.textContent=hms(elapsed(s,t));}
  if(ui.view==='timer'){
    const agg=aggregate(t),d=agg.byDay[ui.day]||{total:0,tasks:{}};
    const tt=$('#todayTotal');if(tt)tt.textContent=hms(d.total);
    document.querySelectorAll('[data-live]').forEach(el=>{el.textContent=hms(d.tasks[el.dataset.live]||0);});
  }else if((ui.view==='calendar'||ui.view==='reports')&&runningSession()&&t-(ui.lastFull||0)>5000&&$('#modal').hidden){
    ui.lastFull=t;renderMain();
  }
}
function loop(){tick();requestAnimationFrame(loop);}
document.addEventListener('visibilitychange',()=>{
  try{localStorage.setItem(LS_SEEN,String(now()));}catch(e){}
  if(document.visibilityState==='visible'){
    ui.lastSlow=0;
    if(ui.view==='stopwatch'){renderStopwatch();const s=openFor(ui.swTask);if(s&&s.status==='running')acquireWake();}
    else{renderMain();renderDock();}
  }
});
window.addEventListener('pagehide',()=>{try{localStorage.setItem(LS_SEEN,String(now()));}catch(e){}});
setInterval(()=>{if(document.visibilityState==='visible'){try{localStorage.setItem(LS_SEEN,String(now()));}catch(e){}}},5000);

/* ---------- start ---------- */
async function init(){
  const t0=now();
  const prevSeen=(function(){try{return +localStorage.getItem(LS_SEEN)||0;}catch(e){return 0;}})();
  await loadData();
  ui.day=dayKey(t0);
  const d=parseKey(ui.day);
  ui.cal={y:d.getFullYear(),m:d.getMonth(),sel:ui.day};
  ui.rep={mode:'day',key:ui.day};
  let h='';try{h=location.hash.slice(1);}catch(e){}
  const run=runningSession();
  if(run&&task(run.taskId)&&(!h||h==='stopwatch')){ui.swTask=run.taskId;ui.view='stopwatch';}
  else if(['timer','calendar','reports'].indexOf(h)>=0)ui.view=h;
  render();
  requestAnimationFrame(loop);
  // recovery: a session kept running while the app was closed
  if(run&&task(run.taskId)&&prevSeen&&t0-prevSeen>5*60000){
    const g=run.segments[run.segments.length-1];
    const lastActive=Math.max(prevSeen,g.start);
    dialog({title:'Welcome back',body:'<b>'+esc(tname(run.taskId))+'</b> kept running while the app was closed. The last activity was at '+esc(fmtClock(lastActive))+', '+esc(hms(t0-lastActive))+' ago.',actions:[
      {label:'Keep the full time ('+hms(elapsed(run))+')',kind:'primary',fn:()=>{}},
      {label:'Stop the clock at '+fmtClock(lastActive),kind:'ghost',fn:()=>{g.end=lastActive;run.status='paused';run.touched=now();persist();render();toast('Paused at '+hms(elapsed(run)));}}]});
  }
}
init();
})();
</script>
